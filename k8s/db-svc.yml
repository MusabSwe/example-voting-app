apiVersion: v1
kind: Service

metadata:
  name: db
  labels:
    app: db
spec:
  type: ClusterIP # if not specified the default will be ClusterIP
  ports:
    - name: db-svc
      targetPort: 5432 # pod port
      port: 5432 # svc port
  selector: # mean which request to svc port (targetPort) should forward traffic to any pod with label app: db
    app: db
  