apiVersion: v1
kind: Service

metadata:
  name: result
  labels:
    app: result
spec:
  type: NodePort # to be accessed by external users
  ports:
    - name: result-svc
      targetPort: 80 # pod port 
      port: 8081 # svc port
      nodePort: 31001
  selector: # mean which request to svc port (targetPort) should forward traffic to any pod with label app: result
    app: result
  