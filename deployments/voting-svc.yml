apiVersion: v1
kind: Service

metadata:
  name: vote
  labels:
    app: vote
spec:
  type: NodePort # to be accessed by external users
  ports:
    - name: vote-svc
      targetPort: 80 # pod port 
      port: 8080 # svc port
      nodePort: 31000
  selector: # mean which request to svc port (targetPort) should forward traffic to any pod with label app: vote
    app: vote
  